[pytest]
# Home Assistant's own test suite style: async tests need no per-test
# marker. Without this, every `async def test_` is COLLECTED AND SKIPPED,
# which reads as a green run while testing nothing.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
norecursedirs = .git testing_config
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --disable-warnings
    --cov=custom_components.smart_sprinkler_control
    --cov-report=term-missing
    --cov-report=html
    # Current floor. The existing tests exercise precipitation discovery/
    # timezone logic by importing the source file directly, so package-level
    # coverage is near zero today. Keep this at 0 so the suite is not blocked
    # on an aspirational target; raise it as real package coverage grows.
    --cov-fail-under=0
markers =
    integration: Integration tests
    unit: Unit tests
    slow: Slow running tests
